apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-mini-lab
  labels:
    app: cloudops-mini-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudops-mini-lab
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cloudops-mini-lab
    spec:
      containers:
        - name: web
          image: cloudops-mini-lab:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              value: "kubernetes-local"
            - name: SERVICE_NAME
              value: "cloudops-mini-lab"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudops-mini-lab
spec:
  type: NodePort
  selector:
    app: cloudops-mini-lab
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
