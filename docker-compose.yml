services:
  app:
    build: .
    image: cloudops-mini-lab:local
    container_name: cloudops-app
    environment:
      APP_VERSION: "local-compose"
      SERVICE_NAME: "student-expense-tracker"
      DATABASE_PATH: "/data/expenses.db"
    volumes:
      - expense-data:/data
    ports:
      - "8080:8000"
    restart: unless-stopped
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cloudops-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.3.0
    container_name: cloudops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cloudops123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - observability

networks:
  observability:
    name: cloudops-observability

volumes:
  expense-data:
  prometheus-data:
  grafana-data:
